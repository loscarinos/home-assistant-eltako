name: Test cover fix

on:
  push:
    branches:
      - test/cover-fix-ci
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --quiet -r requirements.txt
      - name: Run cover regression tests
        id: tests
        continue-on-error: true
        run: |
          python -m unittest tests.test_cover_defensive_state -v > test-output.txt 2>&1
          echo $? > test-exit-code.txt
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cover-test-output
          path: |
            test-output.txt
            test-exit-code.txt
      - name: Fail if tests failed
        run: test "$(cat test-exit-code.txt)" = "0"
