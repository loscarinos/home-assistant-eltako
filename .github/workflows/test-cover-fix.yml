name: Test cover fix

on:
  push:
    branches:
      - test/cover-fix-ci
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --quiet -r requirements.txt
      - name: Run existing and new cover tests
        id: tests
        continue-on-error: true
        run: |
          set +e
          python - <<'PY' > test-output.txt 2>&1
          import asyncio
          import unittest

          loop = asyncio.new_event_loop()
          asyncio.set_event_loop(loop)
          suite = unittest.defaultTestLoader.loadTestsFromNames([
              "tests.test_cover_G5_3F_7F",
              "tests.test_cover_defensive_state",
          ])
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          asyncio.set_event_loop(None)
          loop.close()
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY
          echo $? > test-exit-code.txt
          exit 0
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cover-test-output
          path: |
            test-output.txt
            test-exit-code.txt
      - name: Fail if tests failed
        run: test "$(cat test-exit-code.txt)" = "0"
