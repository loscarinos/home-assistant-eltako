name: Test cover fix

on:
  push:
    branches:
      - test/cover-fix-ci
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --quiet -r requirements.txt
      - name: Run cover regression tests
        run: python -m unittest tests.test_cover_defensive_state -v
